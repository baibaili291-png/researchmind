# 基础部署：只跑应用本身。
#
# 默认存储是 SQLite（证据账本落在容器内的 /app/data 卷），不依赖任何外部服务，
# 因此可以直接托管在只提供一个 HTTP 端口的平台上。
#
# 需要生产级 PostgreSQL + Redis 时，叠加生产覆盖文件：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - researchmind-data:/app/data
    restart: unless-stopped

volumes:
  researchmind-data:
